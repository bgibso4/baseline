name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: .build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Baseline.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # Cache the rest of DerivedData (Build/, ModuleCache.noindex/, etc.) so
      # subsequent runs incrementally compile instead of starting cold. The
      # SourcePackages cache above is intentionally separate (different key
      # cadence). Key on Swift sources + the checked-in pbxproj + Package.resolved
      # so any source/config change busts the cache; the restore-keys fallback
      # still hands a warm tree to the compiler.
      - name: Cache DerivedData (build artifacts)
        uses: actions/cache@v4
        with:
          path: |
            .build/DerivedData/Build
            .build/DerivedData/ModuleCache.noindex
          key: dd-${{ runner.os }}-xcode27.1-${{ hashFiles('**/*.swift', 'Baseline.xcodeproj/project.pbxproj', 'Baseline.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            dd-${{ runner.os }}-xcode27.1-

      - name: Install tooling
        run: brew install swiftlint xcbeautify

      - name: Lint (strict)
        run: make lint

      - name: Build & test (logic)
        run: make test

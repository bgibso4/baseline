name: TestFlight

# Every merge to main that CI passed goes to TestFlight: the internal group gets it automatically. Run workflow (on
# main, once CI has passed for its head) archives and uploads main's head again as a new build. Releasing to the App
# Store stays a manual step in App Store Connect (docs/TESTFLIGHT_SOP.md).
#
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (an Admin App Store Connect API key), BUILD_CERTIFICATE_P12 (an Apple
# Development certificate and its private key, exported from Keychain Access as .p12, base64) and
# BUILD_CERTIFICATE_PASSWORD (the .p12's password).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# The commit in the run's name: plan.sh finds the last upload's commit by it.
run-name: TestFlight ${{ github.event.workflow_run.head_sha || github.sha }}

# One upload at a time, in order; never cancel one that's running.
concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Whether to upload (scripts/testflight/plan.sh): after a green CI run on a push to main, unless only docs/ and
  # Markdown changed since the last upload; on a dispatch, only main and only once CI has passed for it.
  plan:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      upload: ${{ steps.plan.outputs.upload }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The last upload can be several merges back.
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REF: ${{ github.ref }}
        run: |
          upload="$(scripts/testflight/plan.sh "$EVENT" "$SHA" "$REF")"
          echo "upload=$upload" >> "$GITHUB_OUTPUT"

  upload:
    needs: plan
    if: needs.plan.outputs.upload == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      # The build number is the run number plus 3: builds 1-3 were uploaded by hand from Xcode. A re-run keeps the
      # number, so re-run only a run that failed before its upload.
      - name: Build number and key path
        run: |
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 3))" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Install tools
        run: brew install xcodegen xcbeautify

      # The key lives only in $RUNNER_TEMP for this job; the always() step at the end deletes it.
      - name: Write the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"

      # The archive signs with this Apple Development certificate (Baseline's entitlements need one); having it here
      # is what stops Xcode creating a new one each run. It lives in a keychain of its own, deleted at the end.
      - name: Install the development certificate
        env:
          BUILD_CERTIFICATE_P12: ${{ secrets.BUILD_CERTIFICATE_P12 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          umask 077
          printf '%s' "$BUILD_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/development.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/development.p12" -P "$BUILD_CERTIFICATE_PASSWORD" -f pkcs12 -k "$keychain" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/development.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # the existing keychains, one word each
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      # The archive must never create a certificate (Apple caps them). Count them before and after.
      - name: Count development certificates
        id: certificates
        run: |
          count="$(swift scripts/testflight/asc.swift count-certificates --type DEVELOPMENT)" ||
            { echo "error: couldn't count the development certificates, so the run can't prove it made none" >&2; exit 1; }
          echo "before=$count" >> "$GITHUB_OUTPUT"

      - name: Archive and upload
        run: make testflight-archive

      # Also after a failed archive or export: either could have made one.
      - name: Check no certificate was created
        if: always() && steps.certificates.outputs.before != ''
        env:
          BEFORE: ${{ steps.certificates.outputs.before }}
        run: |
          after="$(swift scripts/testflight/asc.swift count-certificates --type DEVELOPMENT)" ||
            { echo "error: couldn't count the development certificates after the upload" >&2; exit 1; }
          echo "Development certificates: $BEFORE before, $after after"
          [ "$after" -le "$BEFORE" ] || { echo "error: the run created a development certificate; revoke it in Certificates, Identifiers & Profiles" >&2; exit 1; }

      - name: Delete the API key and the signing keychain
        if: always()
        run: |
          rm -f "$ASC_KEY_PATH" "$RUNNER_TEMP/development.p12"
          [ -z "${SIGNING_KEYCHAIN:-}" ] || security delete-keychain "$SIGNING_KEYCHAIN" || true
